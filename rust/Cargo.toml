[package]
name = "fusion_rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust sensor-fusion pipeline (C++ twin lives in ../cpp)"
publish = false

[[bin]]
name = "fusion_rust"
path = "src/main.rs"

[dependencies]
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
lto = false
codegen-units = 16
# opt-level = 3 is the Cargo default; keep LTO off unless a loop report changes it.
